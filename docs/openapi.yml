  /api/v1/settings/notifications/:
    get:
      operationId: settings_notifications_retrieve
      description: Turn notification emails on or off. Reset and verification codes
        are always sent.
      tags:
      - Notifications
      security:
      - bearerAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NotificationSettings'
          description: ''
    patch:
      operationId: settings_notifications_partial_update
      description: Turn notification emails on or off. Reset and verification codes
        are always sent.
      tags:
      - Notifications
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PatchedNotificationSettings'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/PatchedNotificationSettings'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/PatchedNotificationSettings'
      security:
      - bearerAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NotificationSettings'
          description: ''
  /api/v1/social/facebook/connect/:
    get:
      operationId: social_facebook_connect_retrieve
      description: Start Meta / Facebook OAuth flow.
      tags:
      - Social
      security:
      - bearerAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthorizationUrl'
          description: ''
  /api/v1/social/instagram/connect/:
    get:
      operationId: social_instagram_connect_retrieve
      description: Start Meta / Instagram OAuth flow.
      tags:
      - Social
      security:
      - bearerAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthorizationUrl'
          description: ''
  /api/v1/social/youtube/:
    get:
      operationId: social_youtube_retrieve
      description: GET the connection state; DELETE to disconnect (tokens are deleted).
      tags:
      - Social
      security:
      - bearerAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/YouTubeStatus'
          description: ''
    delete:
      operationId: social_youtube_destroy
      description: GET the connection state; DELETE to disconnect (tokens are deleted).
      tags:
      - Social
      security:
      - bearerAuth: []
      responses:
        '204':
          description: No response body
  /api/v1/social/youtube/callback/:
    get:
      operationId: social_youtube_callback_retrieve
      description: |-
        Google redirects the browser here, so there is no bearer token and nothing is saved.

        It only checks the state's signature and age, then redirects to the frontend:
        ``?youtube=confirm&code=...&state=...`` (the frontend, logged in, then POSTs both to
        ``/social/youtube/complete/``) or ``?youtube=error&reason=...``.
      tags:
      - Social
      security:
      - {}
      responses:
        '302':
          description: Redirect to the frontend connections page
  /api/v1/social/youtube/complete/:
    post:
      operationId: social_youtube_complete_create
      description: |-
        Finish connecting YouTube. Send back the ``code`` and ``state`` the callback redirect carried.

        The state must have been issued to the logged-in creator, so a link started by someone else
        cannot be completed here.
      tags:
      - Social
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CompleteConnect'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/CompleteConnect'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/CompleteConnect'
        required: true
      security:
      - bearerAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/YouTubeStatus'
          description: ''
  /api/v1/social/youtube/connect/:
    get:
      operationId: social_youtube_connect_retrieve
      description: 'Start the OAuth flow: returns the Google consent URL to send the
        creator to.'
      tags:
      - Social
      security:
      - bearerAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthorizationUrl'
          description: ''
  /api/v1/social/youtube/recent-content/:
    get:
      operationId: social_youtube_recent_content_list
      description: Recent videos from the last sync, used to suggest portfolio items.
      tags:
      - Social
      security:
      - bearerAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/RecentVideo'
          description: ''
  /api/v1/social/youtube/refresh/:
    post:
      operationId: social_youtube_refresh_create
      description: Ask for an immediate stats refresh (rate limited by a cooldown).
      tags:
      - Social
      security:
      - bearerAuth: []
      responses:
        '202':
          description: No response body
components:
  schemas:
    AcceptedVsNeeded:
      type: object
      properties:
        accepted:
          type: integer
        needed:
          type: integer
      required:
      - accepted
      - needed
    AdminActionLog:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        admin:
          type: object
          additionalProperties: {}
          readOnly: true
        action:
          type: string
          readOnly: true
        target_type:
          type: string
          readOnly: true
        target_id:
          type: integer
          readOnly: true
        target_label:
          type: string
          readOnly: true
        reason:
          type: string
          readOnly: true
        created_at:
          type: string
          format: date-time
          readOnly: true
      required:
      - action
      - admin
      - created_at
      - id
      - reason
      - target_id
      - target_label
      - target_type
    AdminBrandPlatform:
      type: object
      description: The Instagram, TikTok or Facebook link a brand typed, for the admin
        to open and check.
      properties:
        id:
          type: integer
          readOnly: true
        brand:
          type: object
          additionalProperties: {}
          readOnly: true
        platform:
          allOf:
          - $ref: '#/components/schemas/PlatformEnum'
          readOnly: true
        handle_url:
          type: string
          format: uri
          readOnly: true
        review_status:
          allOf:
          - $ref: '#/components/schemas/ReviewStatusEnum'
          readOnly: true
        review_note:
          type: string
          readOnly: true
        connected_at:
          type: string
          format: date-time
          readOnly: true
      required:
      - brand
      - connected_at
      - handle_url
      - id
      - platform
      - review_note
      - review_status
    AdminCampaign:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        title:
          type: string
          readOnly: true
        status:
          allOf:
          - $ref: '#/components/schemas/CampaignStatusEnum'
          readOnly: true
        closed_at:
          type: string
          format: date-time
          readOnly: true
          nullable: true
      required:
      - closed_at
      - id
      - status
      - title
    AdminCampaignRow:
      type: object
      description: One campaign in the moderation list. Expects a ``proposal_count``
        annotation.
      properties:
        id:
          type: integer
          readOnly: true
        title:
          type: string
          readOnly: true
        status:
          allOf:
          - $ref: '#/components/schemas/CampaignStatusEnum'
          readOnly: true
        brand:
          allOf:
          - $ref: '#/components/schemas/AdminPerson'
          readOnly: true
        deadline:
          type: string
          format: date-time
          readOnly: true
        creators_needed:
          type: integer
          readOnly: true
        proposal_count:
          type: integer
          readOnly: true
          description: Every proposal received, withdrawn ones included.
        created_at:
          type: string
          format: date-time
          readOnly: true
        closed_at:
          type: string
          format: date-time
          readOnly: true
          nullable: true
      required:
      - brand
      - closed_at
      - created_at
      - creators_needed
      - deadline
      - id
      - proposal_count
      - status
      - title
    AdminPerson:
      type: object
      properties:
        id:
          type: integer
        username:
          type: string
        full_name:
          type: string
      required:
      - full_name
      - id
      - username
    AdminPlatformStats:
      type: object
      description: A creator's typed Instagram, TikTok or Facebook numbers, for the
        admin to check against the link.
      properties:
        id:
          type: integer
          readOnly: true
        creator:
          type: object
          additionalProperties: {}
          readOnly: true
        platform:
          allOf:
          - $ref: '#/components/schemas/PlatformEnum'
          readOnly: true
        handle_url:
          type: string
          format: uri
          readOnly: true
          nullable: true
        followers:
          type: integer
          readOnly: true
        engagement_rate:
          type: string
          format: decimal
          pattern: ^-?\d{0,3}(?:\.\d{0,2})?$
          readOnly: true
        review_status:
          allOf:
          - $ref: '#/components/schemas/ReviewStatusEnum'
          readOnly: true
        review_note:
          type: string
          readOnly: true
        updated_at:
          type: string
          format: date-time
          readOnly: true
      required:
      - creator
      - engagement_rate
      - followers
      - handle_url
      - id
      - platform
      - review_note
      - review_status
      - updated_at
    AdminReviewCampaign:
      type: object
      properties:
        id:
          type: integer
        title:
          type: string
      required:
      - id
      - title
    AdminReviewRow:
      type: object
      description: 'One review in the moderation list: what was written, by which
        brand, about which creator.'
      properties:
        id:
          type: integer
          readOnly: true
        rating:
          type: integer
          readOnly: true
        text:
          type: string
          readOnly: true
        brand:
          allOf:
          - $ref: '#/components/schemas/AdminPerson'
          readOnly: true
        creator:
          allOf:
          - $ref: '#/components/schemas/AdminPerson'
          readOnly: true
        campaign:
          allOf:
          - $ref: '#/components/schemas/AdminReviewCampaign'
          readOnly: true
        created_at:
          type: string
          format: date-time
          readOnly: true
      required:
      - brand
      - campaign
      - created_at
      - creator
      - id
      - rating
      - text
    AdminUser:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        full_name:
          type: string
          readOnly: true
        email:
          type: string
          format: email
          readOnly: true
        username:
          type: string
          readOnly: true
          description: Required. 150 characters or fewer. Letters, digits and @/./+/-/_
            only.
        role:
          allOf:
          - $ref: '#/components/schemas/RoleEnum'
          readOnly: true
        status:
          type: string
          readOnly: true
        email_verified:
          type: boolean
          readOnly: true
        date_joined:
          type: string
          format: date-time
          readOnly: true
      required:
      - date_joined
      - email
      - email_verified
      - full_name
      - id
      - role
      - status
      - username
    ApplyBlockedReasonEnum:
      type: string
      enum:
      - active_proposal
      - proposal_rejected
      - campaign_closed
    AuthorizationUrl:
      type: object
      properties:
        authorization_url:
          type: string
          format: uri
      required:
      - authorization_url
    BrandDashboard:
      type: object
      properties:
        total_campaigns:
          type: integer
        active_campaigns:
          type: integer
          description: Campaigns currently Published.
        total_proposals:
          type: integer
          description: Across all campaigns, withdrawn included.
        pending_count:
          type: integer
          description: Proposals currently Pending (no decision yet).
        shortlisted_count:
          type: integer
          description: Proposals currently Shortlisted.
        accepted_count:
          type: integer
          description: Proposals currently Accepted.
        draft_count:
          type: integer
          description: Campaigns still in Draft, over all of them.
        first_draft_id:
          type: integer
          nullable: true
          description: The newest Draft campaign, or null when there is none.
        busiest_campaign:
          allOf:
          - $ref: '#/components/schemas/BusiestCampaign'
          nullable: true
          description: The campaign with the most Pending proposals, or null when
            none are pending.
        campaigns:
          type: array
          items:
            $ref: '#/components/schemas/BrandDashboardCampaign'
          description: The 50 newest campaigns.
      required:
      - accepted_count
      - active_campaigns
      - busiest_campaign
      - campaigns
      - draft_count
      - first_draft_id
      - pending_count
      - shortlisted_count
      - total_campaigns
      - total_proposals
    BrandDashboardCampaign:
      type: object
      description: One quick-link row. Expects ``proposal_count`` / ``pending_count``
        / ``accepted_count`` annotations.
      properties:
        id:
          type: integer
          readOnly: true
        title:
          type: string
          readOnly: true
        status:
          allOf:
          - $ref: '#/components/schemas/CampaignStatusEnum'
          readOnly: true
        proposals_url:
          type: string
          readOnly: true
        proposal_count:
          type: integer
          description: All proposals received, withdrawn included.
        pending_count:
          type: integer
          description: Proposals currently Pending (no decision yet).
        accepted_count:
          type: integer
          description: Proposals currently Accepted.
        creators_needed:
          type: integer
          readOnly: true
      required:
      - accepted_count
      - creators_needed
      - id
      - pending_count
      - proposal_count
      - proposals_url
      - status
      - title
    BrandProfile:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        display_name:
          type: string
          readOnly: true
        company_name:
          type: string
          maxLength: 150
        industry:
          type: string
          maxLength: 100
        website:
          type: string
          nullable: true
          maxLength: 500
        logo_url:
          type: string
          nullable: true
          maxLength: 500
        about:
          type: string
          maxLength: 2000
      required:
      - display_name
      - id
    BrandProposal:
      type: object
      description: |-
        A proposal as the brand that received it sees it.

        Expects a queryset annotated by ``annotate_primary_stats`` (creator_id / primary platform).
      properties:
        id:
          type: integer
          readOnly: true
        creator:
          allOf:
          - $ref: '#/components/schemas/CreatorSummary'
          readOnly: true
        proposed_rate:
          type: string
          format: decimal
          pattern: ^-?\d{0,8}(?:\.\d{0,2})?$
          readOnly: true
        cover_message:
          type: string
          readOnly: true
        portfolio_links:
          readOnly: true
        experience_note:
          type: string
          readOnly: true
        status:
          allOf:
          - $ref: '#/components/schemas/ProposalStatusEnum'
          readOnly: true
        withdrawal_reason:
          type: string
          nullable: true
          readOnly: true
        profile_url:
          type: string
          readOnly: true
        completed_at:
          type: string
          format: date-time
          readOnly: true
          nullable: true
        review:
          allOf:
          - $ref: '#/components/schemas/ProposalReview'
          nullable: true
          readOnly: true
        created_at:
          type: string
          format: date-time
          readOnly: true
      required:
      - completed_at
      - cover_message
      - created_at
      - creator
      - experience_note
      - id
      - portfolio_links
      - profile_url
      - proposed_rate
      - review
      - status
      - withdrawal_reason
    BrandSocialAccount:
      type: object
      properties:
        platform:
          allOf:
          - $ref: '#/components/schemas/PlatformEnum'
          readOnly: true
        handle_url:
          type: string
          format: uri
          readOnly: true
        is_verified:
          type: boolean
          readOnly: true
        review_status:
          allOf:
          - $ref: '#/components/schemas/ReviewStatusEnum'
          readOnly: true
        review_note:
          type: string
          readOnly: true
        connected_at:
          type: string
          format: date-time
          readOnly: true
      required:
      - connected_at
      - handle_url
      - is_verified
      - platform
      - review_note
      - review_status
    BrandSocialLink:
      type: object
      description: The link a brand types for Instagram, TikTok or Facebook.
      properties:
        handle_url:
          type: string
          maxLength: 500
      required:
      - handle_url
    BrandSummary:
      type: object
      properties:
        id:
          type: integer
        name:
          type: string
        logo_url:
          type: string
          nullable: true
      required:
      - id
      - logo_url
      - name
    BusiestCampaign:
      type: object
      properties:
        id:
          type: integer
        title:
          type: string
        pending_count:
          type: integer
          description: Proposals currently Pending on this campaign.
      required:
      - id
      - pending_count
      - title
    Campaign:
      type: object
      description: A campaign as its owning brand sees and edits it.
      properties:
        id:
          type: integer
          readOnly: true
        title:
          type: string
          maxLength: 200
        description:
          type: string
          maxLength: 5000
        niche:
          $ref: '#/components/schemas/NicheEnum'
        platform:
          $ref: '#/components/schemas/PlatformEnum'
        budget:
          type: string
          format: decimal
          pattern: ^-?\d{0,8}(?:\.\d{0,2})?$
        deadline:
          type: string
          format: date-time
        deliverables:
          type: string
          maxLength: 2000
        creators_needed:
          type: integer
          maximum: 20
          minimum: 1
          default: 1
        min_followers:
          type: integer
          minimum: 0
