              $ref: '#/components/schemas/Login'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/Login'
        required: true
      security:
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LoginResponse'
          description: ''
  /api/v1/admin/brand-platforms/:
    get:
      operationId: admin_brand_platforms_list
      description: Instagram, TikTok and Facebook links that brands typed. Oldest
        first.
      parameters:
      - name: page
