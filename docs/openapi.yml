  /api/v1/brand/campaigns/{id}/proposals/:
    get:
      operationId: brand_campaigns_proposals_list
      description: |-
        Proposals received for one of the brand's campaigns, newest first.

        Withdrawn proposals are hidden unless ``status=withdrawn`` is requested.
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        required: true
      - name: page
        required: false
        in: query
        description: A page number within the paginated result set.
        schema:
          type: integer
      - name: page_size
        required: false
        in: query
        description: Number of results to return per page.
        schema:
          type: integer
      - in: query
        name: status
        schema:
          enum:
