        in: query
        description: A page number within the paginated result set.
        schema:
          type: integer
      - name: page_size
        required: false
        in: query
        description: Number of results to return per page.
        schema:
          type: integer
      - in: query
        name: status
        schema:
          enum:
          - pending
          - approved
          - rejected
          type: string
          default: pending
          minLength: 1
        description: |-
          * `pending` - Waiting for an admin
          * `approved` - Approved
          * `rejected` - Rejected
      tags:
      - Admin
      security:
