          - shortlisted
          - accepted
          - rejected
          - withdrawn
          type: string
          minLength: 1
        description: |-
          * `pending` - Pending
          * `shortlisted` - Shortlisted
          * `accepted` - Accepted
          * `rejected` - Rejected
