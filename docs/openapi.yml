  /api/v1/campaigns/:
    get:
      operationId: campaigns_list
      description: Open (published, not past deadline) campaigns for logged-in creators.
      parameters:
      - in: query
        name: deadline_after
        schema:
          type: string
          format: date-time
      - in: query
        name: deadline_before
        schema:
          type: string
          format: date-time
      - in: query
        name: max_budget
        schema:
          type: string
          format: decimal
          pattern: ^-?\d{0,8}(?:\.\d{0,2})?$
      - in: query
        name: min_budget
        schema:
          type: string
          format: decimal
          pattern: ^-?\d{0,8}(?:\.\d{0,2})?$
      - in: query
        name: niche
        schema:
          enum:
          - fitness
          - tech
          - beauty
          - food
          - travel
          - other
          type: string
          minLength: 1
        description: |-
          * `fitness` - Fitness
          * `tech` - Tech
          * `beauty` - Beauty
          * `food` - Food
          * `travel` - Travel
          * `other` - Other
      - name: page
        required: false
        in: query
        description: A page number within the paginated result set.
        schema:
          type: integer
      - name: page_size
        required: false
        in: query
        description: Number of results to return per page.
        schema:
          type: integer
      - in: query
        name: platform
