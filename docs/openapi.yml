  /api/v1/brand/campaigns/:
    get:
      operationId: brand_campaigns_list
      description: List the brand's campaigns (newest first) or create a new Draft.
      parameters:
      - name: page
        required: false
        in: query
        description: A page number within the paginated result set.
        schema:
          type: integer
      - name: page_size
        required: false
        in: query
        description: Number of results to return per page.
        schema:
          type: integer
      - in: query
        name: status
        schema:
          enum:
          - draft
          - published
          - closed
          type: string
          minLength: 1
        description: |-
          * `draft` - Draft
          * `published` - Published
          * `closed` - Closed
      tags:
      - Campaigns
      security:
      - bearerAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedCampaignList'
          description: ''
    post:
      operationId: brand_campaigns_create
      description: List the brand's campaigns (newest first) or create a new Draft.
      parameters:
      - in: query
        name: status
        schema:
          enum:
          - draft
          - published
          - closed
          type: string
          minLength: 1
        description: |-
          * `draft` - Draft
          * `published` - Published
          * `closed` - Closed
      tags:
      - Campaigns
      requestBody:
