  /api/v1/creators/:
    get:
      operationId: creators_list
      description: 'Brand-facing creator directory: search, filter, sort, paginate.'
      parameters:
      - in: query
        name: location
        schema:
          type: string
          maxLength: 100
      - in: query
        name: max_engagement
        schema:
          type: string
          format: decimal
          pattern: ^-?\d{0,3}(?:\.\d{0,2})?$
      - in: query
        name: max_followers
        schema:
          type: integer
          minimum: 0
      - in: query
        name: max_rate
        schema:
          type: string
          format: decimal
          pattern: ^-?\d{0,8}(?:\.\d{0,2})?$
      - in: query
        name: min_engagement
        schema:
          type: string
          format: decimal
          pattern: ^-?\d{0,3}(?:\.\d{0,2})?$
      - in: query
        name: min_followers
        schema:
          type: integer
          minimum: 0
      - in: query
        name: min_rate
        schema:
          type: string
          format: decimal
          pattern: ^-?\d{0,8}(?:\.\d{0,2})?$
      - in: query
        name: niche
        schema:
          enum:
          - fitness
          - tech
          - beauty
          - food
          - travel
          - other
          type: string
          minLength: 1
        description: |-
          * `fitness` - Fitness
          * `tech` - Tech
          * `beauty` - Beauty
          * `food` - Food
          * `travel` - Travel
          * `other` - Other
      - in: query
        name: ordering
        schema:
          enum:
          - followers
          - -followers
          - engagement
          - -engagement
          - rate
          - -rate
          type: string
          minLength: 1
        description: |-
          * `followers` - followers
          * `-followers` - -followers
          * `engagement` - engagement
          * `-engagement` - -engagement
          * `rate` - rate
          * `-rate` - -rate
      - name: page
        required: false
        in: query
        description: A page number within the paginated result set.
        schema:
          type: integer
      - name: page_size
        required: false
        in: query
        description: Number of results to return per page.
        schema:
          type: integer
      - in: query
        name: platform
        schema:
          enum:
          - instagram
          - youtube
          - tiktok
          - facebook
          type: string
          minLength: 1
        description: |-
          * `instagram` - Instagram
          * `youtube` - YouTube
          * `tiktok` - TikTok
          * `facebook` - Facebook
      - in: query
        name: q
        schema:
          type: string
          maxLength: 100
      - in: query
        name: verified_only
        schema:
          type: boolean
      tags:
      - Discovery
      security:
      - bearerAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedCreatorCardList'
          description: ''
