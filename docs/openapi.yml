  /api/v1/creators/me/portfolio/{id}/:
    delete:
      operationId: creators_me_portfolio_destroy
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        required: true
      tags:
      - Profiles
      security:
      - bearerAuth: []
      responses:
        '204':
          description: No response body
  /api/v1/creators/me/proposals/:
    get:
      operationId: creators_me_proposals_list
      description: |-
        Every campaign the creator applied to, with the status of each proposal (newest first).

        Withdrawn proposals stay as history, and a resubmission is a separate entry.
      parameters:
      - name: page
        required: false
        in: query
        description: A page number within the paginated result set.
        schema:
          type: integer
      - name: page_size
        required: false
        in: query
        description: Number of results to return per page.
        schema:
          type: integer
      - in: query
        name: status
        schema:
          enum:
          - pending
          - shortlisted
          - accepted
          - rejected
          - withdrawn
          type: string
          minLength: 1
        description: |-
          * `pending` - Pending
          * `shortlisted` - Shortlisted
          * `accepted` - Accepted
          * `rejected` - Rejected
          * `withdrawn` - Withdrawn
      tags:
      - Proposals
      security:
      - bearerAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedMyProposalList'
          description: ''
  /api/v1/creators/me/proposals/{id}/deliverables/:
    get:
      operationId: creators_me_proposals_deliverables_list
      description: The content an accepted creator delivered for a proposal. New ones
        are accepted until completion.
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        required: true
      tags:
      - Proposals
      security:
      - bearerAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Deliverable'
          description: ''
    post:
      operationId: creators_me_proposals_deliverables_create
      description: The content an accepted creator delivered for a proposal. New ones
        are accepted until completion.
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        required: true
      tags:
      - Proposals
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Deliverable'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/Deliverable'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/Deliverable'
        required: true
      security:
      - bearerAuth: []
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Deliverable'
          description: ''
  /api/v1/creators/me/proposals/{id}/deliverables/{deliverable_id}/:
    patch:
      operationId: creators_me_proposals_deliverables_partial_update
      description: Update or remove one deliverable, until the brand marks the collaboration
        Completed.
      parameters:
      - in: path
        name: deliverable_id
        schema:
          type: integer
        required: true
      - in: path
        name: id
        schema:
          type: integer
        required: true
      tags:
      - Proposals
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PatchedDeliverable'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/PatchedDeliverable'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/PatchedDeliverable'
      security:
      - bearerAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Deliverable'
          description: ''
    delete:
      operationId: creators_me_proposals_deliverables_destroy
      description: Update or remove one deliverable, until the brand marks the collaboration
        Completed.
      parameters:
      - in: path
        name: deliverable_id
        schema:
          type: integer
        required: true
      - in: path
        name: id
        schema:
          type: integer
        required: true
      tags:
      - Proposals
      security:
      - bearerAuth: []
      responses:
        '204':
          description: No response body
  /api/v1/creators/me/proposals/{id}/withdraw/:
    post:
      operationId: creators_me_proposals_withdraw_create
      description: Withdraw an active proposal (an Accepted one needs a short reason).
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        required: true
      tags:
      - Proposals
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Withdraw'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/Withdraw'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/Withdraw'
      security:
      - bearerAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Proposal'
          description: ''
  /api/v1/creators/me/stats/:
    get:
      operationId: creators_me_stats_list
      tags:
      - Social
      security:
      - bearerAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/PlatformStats'
          description: ''
  /api/v1/creators/me/stats/{platform}/:
    put:
      operationId: creators_me_stats_update
      description: Enter Unverified stats by hand for a platform (the fallback to
        account connection).
      parameters:
      - in: path
        name: platform
        schema:
          type: string
        required: true
      tags:
      - Social
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PlatformStats'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/PlatformStats'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/PlatformStats'
        required: true
      security:
      - bearerAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PlatformStats'
          description: ''
  /api/v1/health/:
    get:
      operationId: health_retrieve
      description: 'Liveness/readiness probe: confirms the app can reach its database.'
      tags:
      - Health
      security:
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                type: object
                additionalProperties: {}
          description: ''
  /api/v1/notifications/:
    get:
      operationId: notifications_list
      parameters:
      - name: page
        required: false
        in: query
        description: A page number within the paginated result set.
        schema:
          type: integer
      - name: page_size
        required: false
        in: query
        description: Number of results to return per page.
        schema:
          type: integer
      tags:
      - Notifications
      security:
      - bearerAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedNotificationList'
          description: ''
  /api/v1/notifications/{id}/read/:
    post:
      operationId: notifications_read_create
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        required: true
      tags:
      - Notifications
      security:
      - bearerAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Notification'
          description: ''
  /api/v1/notifications/read-all/:
    post:
      operationId: notifications_read_all_create
      tags:
      - Notifications
      security:
      - bearerAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MarkAllReadResponse'
          description: ''
  /api/v1/settings/notifications/:
    get:
      operationId: settings_notifications_retrieve
      description: Turn notification emails on or off. Reset and verification codes
        are always sent.
      tags:
      - Notifications
      security:
      - bearerAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NotificationSettings'
          description: ''
    patch:
      operationId: settings_notifications_partial_update
      description: Turn notification emails on or off. Reset and verification codes
        are always sent.
      tags:
      - Notifications
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PatchedNotificationSettings'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/PatchedNotificationSettings'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/PatchedNotificationSettings'
      security:
      - bearerAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NotificationSettings'
          description: ''
  /api/v1/social/youtube/:
    get:
      operationId: social_youtube_retrieve
      description: GET the connection state; DELETE to disconnect (tokens are deleted).
      tags:
      - Social
      security:
      - bearerAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/YouTubeStatus'
          description: ''
    delete:
      operationId: social_youtube_destroy
      description: GET the connection state; DELETE to disconnect (tokens are deleted).
      tags:
      - Social
      security:
      - bearerAuth: []
      responses:
        '204':
          description: No response body
  /api/v1/social/youtube/callback/:
    get:
      operationId: social_youtube_callback_retrieve
      description: |-
        Google redirects the browser here, so there is no bearer token.

        The signed ``state`` identifies the creator. The response is always a redirect back to
        the frontend: ``?youtube=success`` or ``?youtube=error&reason=...``.
      tags:
      - Social
      security:
      - {}
      responses:
        '302':
          description: Redirect to the frontend connections page
  /api/v1/social/youtube/connect/:
    get:
      operationId: social_youtube_connect_retrieve
      description: 'Start the OAuth flow: returns the Google consent URL to send the
        creator to.'
      tags:
      - Social
      security:
      - bearerAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthorizationUrl'
          description: ''
  /api/v1/social/youtube/recent-content/:
    get:
      operationId: social_youtube_recent_content_list
      description: Recent videos from the last sync, used to suggest portfolio items.
      tags:
      - Social
      security:
      - bearerAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/RecentVideo'
          description: ''
  /api/v1/social/youtube/refresh/:
    post:
      operationId: social_youtube_refresh_create
      description: Ask for an immediate stats refresh (rate limited by a cooldown).
      tags:
      - Social
      security:
      - bearerAuth: []
      responses:
        '202':
          description: No response body
components:
  schemas:
    ApplyBlockedReasonEnum:
      type: string
      enum:
      - active_proposal
      - proposal_rejected
      - campaign_closed
    AuthorizationUrl:
      type: object
      properties:
        authorization_url:
          type: string
          format: uri
      required:
      - authorization_url
    BrandDashboard:
      type: object
      properties:
        total_campaigns:
          type: integer
        active_campaigns:
          type: integer
          description: Campaigns currently Published.
        total_proposals:
          type: integer
          description: Across all campaigns, withdrawn included.
        shortlisted_count:
          type: integer
          description: Proposals currently Shortlisted.
        accepted_count:
          type: integer
          description: Proposals currently Accepted.
        campaigns:
          type: array
          items:
            $ref: '#/components/schemas/BrandDashboardCampaign'
          description: The 50 newest campaigns.
      required:
      - accepted_count
      - active_campaigns
      - campaigns
      - shortlisted_count
      - total_campaigns
      - total_proposals
    BrandDashboardCampaign:
      type: object
      description: One quick-link row. Expects ``proposal_count`` / ``accepted_count``
        annotations.
      properties:
        id:
          type: integer
          readOnly: true
        title:
          type: string
          readOnly: true
        status:
          allOf:
          - $ref: '#/components/schemas/CampaignStatusEnum'
          readOnly: true
        proposals_url:
          type: string
          readOnly: true
        proposal_count:
          type: integer
          description: All proposals received, withdrawn included.
        accepted_count:
          type: integer
          description: Proposals currently Accepted.
        creators_needed:
          type: integer
          readOnly: true
      required:
      - accepted_count
      - creators_needed
      - id
      - proposal_count
      - proposals_url
      - status
      - title
    BrandProfile:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        display_name:
          type: string
          readOnly: true
        company_name:
          type: string
          maxLength: 150
        industry:
          type: string
          maxLength: 100
        website:
          type: string
          nullable: true
          maxLength: 500
        logo_url:
          type: string
          nullable: true
          maxLength: 500
        about:
          type: string
          maxLength: 2000
      required:
      - display_name
      - id
    BrandProposal:
      type: object
      description: |-
        A proposal as the brand that received it sees it.

        Expects a queryset annotated by ``annotate_primary_stats`` (creator_id / primary platform).
      properties:
        id:
          type: integer
          readOnly: true
        creator:
          allOf:
          - $ref: '#/components/schemas/CreatorSummary'
          readOnly: true
        proposed_rate:
          type: string
          format: decimal
          pattern: ^-?\d{0,8}(?:\.\d{0,2})?$
          readOnly: true
        cover_message:
          type: string
          readOnly: true
        portfolio_links:
          readOnly: true
        experience_note:
          type: string
          readOnly: true
        status:
          allOf:
          - $ref: '#/components/schemas/ProposalStatusEnum'
          readOnly: true
        withdrawal_reason:
          type: string
          nullable: true
          readOnly: true
        profile_url:
          type: string
          readOnly: true
        completed_at:
          type: string
          format: date-time
          readOnly: true
          nullable: true
        created_at:
          type: string
          format: date-time
          readOnly: true
      required:
      - completed_at
      - cover_message
      - created_at
      - creator
      - experience_note
      - id
      - portfolio_links
      - profile_url
      - proposed_rate
      - status
      - withdrawal_reason
    BrandSummary:
      type: object
      properties:
        id:
          type: integer
        name:
          type: string
        logo_url:
          type: string
          nullable: true
      required:
      - id
      - logo_url
      - name
    Campaign:
      type: object
      description: A campaign as its owning brand sees and edits it.
      properties:
        id:
          type: integer
          readOnly: true
        title:
          type: string
          maxLength: 200
        description:
          type: string
          maxLength: 5000
        niche:
          $ref: '#/components/schemas/NicheEnum'
        platform:
          $ref: '#/components/schemas/PlatformEnum'
        budget:
          type: string
          format: decimal
          pattern: ^-?\d{0,8}(?:\.\d{0,2})?$
        deadline:
          type: string
          format: date-time
        deliverables:
          type: string
          maxLength: 2000
        creators_needed:
          type: integer
          maximum: 20
          minimum: 1
          default: 1
        min_followers:
          type: integer
          minimum: 0
          nullable: true
        status:
          allOf:
          - $ref: '#/components/schemas/CampaignStatusEnum'
          readOnly: true
        published_at:
          type: string
          format: date-time
          readOnly: true
          nullable: true
        closed_at:
          type: string
          format: date-time
          readOnly: true
          nullable: true
        created_at:
          type: string
          format: date-time
          readOnly: true
      required:
      - budget
      - closed_at
      - created_at
      - deadline
      - deliverables
      - description
      - id
      - niche
      - platform
      - published_at
      - status
      - title
    CampaignCard:
      type: object
      description: |-
        A campaign as a creator sees it in the directory.

        Needs ``followers_by_platform`` (the requesting creator's follower counts) in the
        serializer context to compute ``eligible``.
      properties:
        id:
          type: integer
          readOnly: true
        title:
          type: string
          readOnly: true
        brand:
          allOf:
          - $ref: '#/components/schemas/BrandSummary'
          readOnly: true
        niche:
          allOf:
          - $ref: '#/components/schemas/NicheEnum'
          readOnly: true
        budget:
          type: string
          format: decimal
          pattern: ^-?\d{0,8}(?:\.\d{0,2})?$
          readOnly: true
        platform:
          allOf:
          - $ref: '#/components/schemas/PlatformEnum'
          readOnly: true
        deadline:
          type: string
          format: date-time
          readOnly: true
        creators_needed:
          type: integer
          readOnly: true
        eligible:
          type: boolean
          readOnly: true
      required:
      - brand
      - budget
      - creators_needed
      - deadline
      - eligible
      - id
      - niche
      - platform
      - title
    CampaignDeliverablesRow:
      type: object
      description: One accepted creator and everything they have delivered for a campaign.
      properties:
        proposal_id:
          type: integer
        creator:
          allOf:
          - $ref: '#/components/schemas/DeliverableCreator'
          readOnly: true
        completed_at:
          type: string
          format: date-time
          nullable: true
        deliverables:
          type: array
          items:
            $ref: '#/components/schemas/Deliverable'
      required:
      - completed_at
      - creator
      - deliverables
      - proposal_id
    CampaignDetail:
      type: object
      description: Full details plus the viewing creator's apply state (needs ``request``
        in the context).
      properties:
        id:
          type: integer
          readOnly: true
        title:
          type: string
          readOnly: true
        brand:
          allOf:
          - $ref: '#/components/schemas/BrandSummary'
          readOnly: true
        niche:
          allOf:
          - $ref: '#/components/schemas/NicheEnum'
          readOnly: true
        budget:
          type: string
          format: decimal
          pattern: ^-?\d{0,8}(?:\.\d{0,2})?$
          readOnly: true
        platform:
          allOf:
          - $ref: '#/components/schemas/PlatformEnum'
          readOnly: true
        deadline:
          type: string
          format: date-time
          readOnly: true
        creators_needed:
          type: integer
          readOnly: true
        eligible:
          type: boolean
          readOnly: true
        description:
          type: string
          readOnly: true
        deliverables:
          type: string
          readOnly: true
        min_followers:
          type: integer
          readOnly: true
          nullable: true
        status:
          allOf:
          - $ref: '#/components/schemas/CampaignStatusEnum'
          readOnly: true
        accepted_count:
          type: integer
          readOnly: true
        all_creators_selected:
          type: boolean
          readOnly: true
        can_apply:
          type: boolean
          readOnly: true
        apply_blocked_reason:
          allOf:
          - $ref: '#/components/schemas/ApplyBlockedReasonEnum'
          nullable: true
          readOnly: true
      required:
      - accepted_count
      - all_creators_selected
      - apply_blocked_reason
      - brand
      - budget
      - can_apply
      - creators_needed
      - deadline
      - deliverables
      - description
      - eligible
      - id
      - min_followers
      - niche
      - platform
      - status
      - title
    CampaignStatusEnum:
      enum:
      - draft
      - published
      - closed
      type: string
      description: |-
        * `draft` - Draft
        * `published` - Published
        * `closed` - Closed
    CompletionResult:
      type: object
      properties:
        id:
          type: integer
        status:
          $ref: '#/components/schemas/ProposalStatusEnum'
        completed_at:
          type: string
          format: date-time
      required:
      - completed_at
      - id
      - status
    CreatorCard:
      type: object
      description: A directory result. Expects a profile annotated by ``annotate_primary_stats``.
      properties:
        id:
          type: integer
        name:
          type: string
        photo_url:
          type: string
          nullable: true
        niche:
          nullable: true
          oneOf:
          - $ref: '#/components/schemas/NicheEnum'
          - $ref: '#/components/schemas/NullEnum'
        primary_platform:
          nullable: true
          oneOf:
          - $ref: '#/components/schemas/PlatformEnum'
          - $ref: '#/components/schemas/NullEnum'
        followers:
          type: integer
          nullable: true
        engagement_rate:
          type: string
          format: decimal
          pattern: ^-?\d{0,3}(?:\.\d{0,2})?$
          nullable: true
        is_verified:
          type: boolean
      required:
      - engagement_rate
      - followers
      - id
      - is_verified
      - name
      - niche
      - photo_url
      - primary_platform
    CreatorDashboard:
      type: object
      properties:
        profile_completion:
          type: integer
        youtube:
          $ref: '#/components/schemas/DashboardYouTube'
        available_campaigns:
          type: array
          items:
            $ref: '#/components/schemas/CampaignCard'
        applications:
          type: array
          items:
            $ref: '#/components/schemas/MyProposal'
        accepted_campaigns:
          type: array
          items:
            $ref: '#/components/schemas/MyProposal'
        performance:
          $ref: '#/components/schemas/Performance'
      required:
      - accepted_campaigns
      - applications
      - available_campaigns
      - performance
      - profile_completion
      - youtube
    CreatorDetail:
      type: object
      description: The brand-facing view of a creator. Private account data (email,
        phone) is excluded.
      properties:
        id:
          type: integer
          readOnly: true
        username:
          type: string
          readOnly: true
        full_name:
          type: string
          readOnly: true
        photo_url:
          type: string
          format: uri
          readOnly: true
          nullable: true
        bio:
          type: string
          readOnly: true
        niche:
          readOnly: true
          nullable: true
          oneOf:
          - $ref: '#/components/schemas/NicheEnum'
          - $ref: '#/components/schemas/NullEnum'
        primary_platform:
          readOnly: true
          nullable: true
          oneOf:
          - $ref: '#/components/schemas/PlatformEnum'
          - $ref: '#/components/schemas/NullEnum'
        city:
          type: string
          readOnly: true
        country:
          type: string
          readOnly: true
        rate_post:
          type: string
          format: decimal
          pattern: ^-?\d{0,8}(?:\.\d{0,2})?$
          readOnly: true
          nullable: true
        rate_story:
          type: string
          format: decimal
          pattern: ^-?\d{0,8}(?:\.\d{0,2})?$
          readOnly: true
          nullable: true
        rate_video:
          type: string
          format: decimal
          pattern: ^-?\d{0,8}(?:\.\d{0,2})?$
          readOnly: true
          nullable: true
        stats:
          type: array
          items:
            $ref: '#/components/schemas/PlatformStats'
          readOnly: true
        portfolio:
          type: array
          items:
            $ref: '#/components/schemas/PortfolioItem'
          readOnly: true
      required:
      - bio
      - city
      - country
      - full_name
      - id
      - niche
      - photo_url
      - portfolio
      - primary_platform
      - rate_post
      - rate_story
      - rate_video
      - stats
      - username
    CreatorProfile:
      type: object
      properties:
        id:
