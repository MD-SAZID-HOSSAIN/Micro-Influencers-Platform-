    PasswordResetConfirm:
      type: object
      properties:
        email:
          type: string
          format: email
        code:
          type: string
          pattern: ^\d{6}$
        new_password:
          type: string
          writeOnly: true
          maxLength: 128
          minLength: 8
      required:
      - code
      - email
      - new_password
    PasswordResetRequest:
      type: object
      properties:
        email:
          type: string
          format: email
      required:
      - email
    PatchedBrandProfile:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        display_name:
          type: string
          readOnly: true
        company_name:
          type: string
          maxLength: 150
        industry:
          type: string
          maxLength: 100
        website:
          type: string
          nullable: true
          maxLength: 500
        logo_url:
          type: string
          nullable: true
          maxLength: 500
        about:
          type: string
          maxLength: 2000
    PatchedCampaign:
      type: object
      description: A campaign as its owning brand sees and edits it.
      properties:
        id:
          type: integer
          readOnly: true
        title:
          type: string
          maxLength: 200
        description:
          type: string
          maxLength: 5000
        niche:
          $ref: '#/components/schemas/NicheEnum'
        platform:
          $ref: '#/components/schemas/PlatformEnum'
        budget:
          type: string
          format: decimal
          pattern: ^-?\d{0,8}(?:\.\d{0,2})?$
        deadline:
          type: string
          format: date-time
        deliverables:
          type: string
          maxLength: 2000
        creators_needed:
          type: integer
          maximum: 20
          minimum: 1
          default: 1
        min_followers:
          type: integer
          minimum: 0
          nullable: true
        allow_withdrawal:
          type: boolean
          default: true
          description: 'True: creators may withdraw their proposal. False: once they
            apply, they cannot withdraw.'
        media:
          type: array
          items:
            $ref: '#/components/schemas/CampaignMedia'
          readOnly: true
        status:
          allOf:
          - $ref: '#/components/schemas/CampaignStatusEnum'
          readOnly: true
        published_at:
          type: string
          format: date-time
          readOnly: true
          nullable: true
        closed_at:
          type: string
          format: date-time
          readOnly: true
          nullable: true
        created_at:
          type: string
          format: date-time
          readOnly: true
    PatchedCreatorProfile:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        username:
          type: string
          readOnly: true
        full_name:
          type: string
          maxLength: 150
        photo_url:
          type: string
          nullable: true
          maxLength: 500
        bio:
          type: string
          maxLength: 1000
        niche:
          nullable: true
          oneOf:
          - $ref: '#/components/schemas/NicheEnum'
          - $ref: '#/components/schemas/NullEnum'
        primary_platform:
          nullable: true
          oneOf:
          - $ref: '#/components/schemas/PlatformEnum'
          - $ref: '#/components/schemas/NullEnum'
        city:
          type: string
          maxLength: 100
        country:
          type: string
          maxLength: 100
        rate_post:
          type: string
          format: decimal
          pattern: ^-?\d{0,8}(?:\.\d{0,2})?$
          nullable: true
        rate_story:
          type: string
          format: decimal
          pattern: ^-?\d{0,8}(?:\.\d{0,2})?$
          nullable: true
        rate_video:
          type: string
          format: decimal
          pattern: ^-?\d{0,8}(?:\.\d{0,2})?$
          nullable: true
        rating_avg:
          type: string
          format: decimal
          pattern: ^-?\d{0,1}(?:\.\d{0,2})?$
          readOnly: true
          nullable: true
        rating_count:
          type: integer
          readOnly: true
        completion_percent:
          type: integer
          readOnly: true
        stats:
          type: array
          items:
            $ref: '#/components/schemas/PlatformStats'
          readOnly: true
    PatchedDeliverable:
      type: object
      description: A link to published content. Used for create (all fields) and for
        partial update.
      properties:
        id:
          type: integer
          readOnly: true
        post_url:
          type: string
          maxLength: 500
        platform:
          $ref: '#/components/schemas/PlatformEnum'
        note:
          type: string
          maxLength: 500
        created_at:
          type: string
          format: date-time
          readOnly: true
        updated_at:
          type: string
          format: date-time
          readOnly: true
    PatchedNotificationSettings:
      type: object
      properties:
        email_enabled:
          type: boolean
        email_verified:
          type: boolean
          readOnly: true
    Performance:
      type: object
      properties:
        proposals_sent:
          type: integer
        accepted:
          type: integer
        acceptance_rate:
          type: number
          format: double
          nullable: true
          description: Ratio from 0 to 1 (0.5 = 50%); null until a proposal is sent.
      required:
      - acceptance_rate
      - accepted
      - proposals_sent
    PlatformEnum:
      enum:
      - instagram
      - youtube
      - tiktok
      - facebook
      type: string
      description: |-
        * `instagram` - Instagram
        * `youtube` - YouTube
        * `tiktok` - TikTok
        * `facebook` - Facebook
    PlatformStats:
      type: object
      properties:
        platform:
          allOf:
          - $ref: '#/components/schemas/PlatformEnum'
          readOnly: true
        handle_url:
          type: string
          nullable: true
          maxLength: 500
        followers:
          type: integer
          maximum: 2000000000
          minimum: 0
        engagement_rate:
          type: string
          format: decimal
          pattern: ^-?\d{0,3}(?:\.\d{0,2})?$
        is_verified:
          type: boolean
          readOnly: true
        review_status:
          allOf:
          - $ref: '#/components/schemas/ReviewStatusEnum'
          readOnly: true
        review_note:
          type: string
          readOnly: true
        is_outdated:
          type: boolean
          readOnly: true
        last_synced_at:
          type: string
          format: date-time
          readOnly: true
          nullable: true
      required:
      - engagement_rate
      - followers
      - is_outdated
      - is_verified
      - last_synced_at
      - platform
      - review_note
      - review_status
    PortfolioItem:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        url:
          type: string
          maxLength: 500
        caption:
          type: string
          maxLength: 200
        source:
          $ref: '#/components/schemas/SourceEnum'
        created_at:
          type: string
          format: date-time
          readOnly: true
      required:
      - created_at
      - id
      - url
    Proposal:
      type: object
      description: A proposal as its own creator sees it.
      properties:
        id:
          type: integer
          readOnly: true
        campaign_id:
          type: integer
          readOnly: true
        status:
          allOf:
          - $ref: '#/components/schemas/ProposalStatusEnum'
          readOnly: true
        cover_message:
          type: string
          readOnly: true
        proposed_rate:
          type: string
          format: decimal
          pattern: ^-?\d{0,8}(?:\.\d{0,2})?$
          readOnly: true
        portfolio_links:
          readOnly: true
        experience_note:
          type: string
          readOnly: true
        withdrawal_reason:
          type: string
          readOnly: true
        completed_at:
          type: string
          format: date-time
          readOnly: true
          nullable: true
        created_at:
          type: string
          format: date-time
          readOnly: true
      required:
      - campaign_id
      - completed_at
      - cover_message
      - created_at
      - experience_note
      - id
      - portfolio_links
      - proposed_rate
      - status
      - withdrawal_reason
    ProposalActionResult:
      type: object
      description: 'What a brand needs after shortlisting/accepting/rejecting: the
        new status and the counter.'
      properties:
        id:
          type: integer
        status:
          $ref: '#/components/schemas/ProposalStatusEnum'
        accepted_count:
          type: integer
        creators_needed:
          type: integer
      required:
      - accepted_count
      - creators_needed
      - id
      - status
    ProposalReview:
      type: object
      description: The brand's own review of a completed collaboration.
      properties:
        id:
          type: integer
        rating:
          type: integer
          maximum: 5
          minimum: 1
        text:
          type: string
        created_at:
          type: string
          format: date-time
      required:
      - created_at
      - id
      - rating
      - text
    ProposalStatusEnum:
      enum:
      - pending
      - shortlisted
      - accepted
      - rejected
      - withdrawn
      type: string
      description: |-
        * `pending` - Pending
        * `shortlisted` - Shortlisted
        * `accepted` - Accepted
        * `rejected` - Rejected
        * `withdrawn` - Withdrawn
    ProposalSubmit:
      type: object
      description: 'What a creator sends. There is no rate: the brand set it on the
        campaign, and nobody can negotiate it.'
      properties:
        cover_message:
          type: string
          maxLength: 3000
        portfolio_links:
          type: array
          items:
            type: string
            maxLength: 500
          maxItems: 3
        experience_note:
          type: string
          default: ''
          maxLength: 2000
      required:
      - cover_message
    PublicPlatformStats:
      type: object
      description: 'What brands see: no review details.'
      properties:
        platform:
          allOf:
          - $ref: '#/components/schemas/PlatformEnum'
          readOnly: true
        handle_url:
          type: string
          nullable: true
          maxLength: 500
        followers:
          type: integer
          maximum: 2000000000
          minimum: 0
        engagement_rate:
          type: string
          format: decimal
          pattern: ^-?\d{0,3}(?:\.\d{0,2})?$
        is_verified:
          type: boolean
          readOnly: true
        is_outdated:
          type: boolean
          readOnly: true
        last_synced_at:
          type: string
          format: date-time
          readOnly: true
          nullable: true
      required:
      - engagement_rate
      - followers
      - is_outdated
      - is_verified
      - last_synced_at
      - platform
    Reason:
      type: object
      description: Every admin action records why it was taken.
      properties:
        reason:
          type: string
          maxLength: 500
      required:
      - reason
    RecentVideo:
      type: object
      properties:
        video_id:
          type: string
        title:
          type: string
        url:
          type: string
          format: uri
        published_at:
          type: string
      required:
      - published_at
      - title
      - url
      - video_id
    Register:
      type: object
      properties:
        role:
          $ref: '#/components/schemas/RegisterRoleEnum'
        full_name:
          type: string
          maxLength: 150
        email:
          type: string
          format: email
          maxLength: 254
        username:
          type: string
          pattern: ^[\w.@+-]+$
          maxLength: 150
        password:
          type: string
          writeOnly: true
          maxLength: 128
          minLength: 8
        mobile_number:
          type: string
          maxLength: 20
      required:
      - email
      - full_name
      - mobile_number
      - password
      - role
      - username
    RegisterRoleEnum:
      enum:
      - creator
      - brand
      type: string
      description: |-
        * `creator` - creator
        * `brand` - brand
    Review:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        rating:
          type: integer
          readOnly: true
        text:
          type: string
          readOnly: true
        brand:
          type: object
          additionalProperties: {}
          readOnly: true
        campaign:
          type: object
          additionalProperties: {}
          readOnly: true
        created_at:
          type: string
          format: date-time
          readOnly: true
      required:
      - brand
      - campaign
      - created_at
      - id
      - rating
      - text
    ReviewCreate:
      type: object
      properties:
        rating:
          type: integer
          maximum: 5
          minimum: 1
        text:
          type: string
          default: ''
          maxLength: 500
      required:
      - rating
    ReviewStatusEnum:
      enum:
      - pending
      - approved
      - rejected
      type: string
      description: |-
        * `pending` - Waiting for an admin
        * `approved` - Approved
        * `rejected` - Rejected
    RoleEnum:
      enum:
      - creator
      - brand
      - admin
      type: string
      description: |-
        * `creator` - Creator
        * `brand` - Brand
        * `admin` - Admin
    SourceEnum:
      enum:
      - manual
      - youtube
      type: string
      description: |-
        * `manual` - Manual
        * `youtube` - YouTube
    User:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        full_name:
          type: string
          readOnly: true
        email:
          type: string
          format: email
          readOnly: true
        username:
          type: string
          readOnly: true
          description: Required. 150 characters or fewer. Letters, digits and @/./+/-/_
            only.
        role:
          allOf:
          - $ref: '#/components/schemas/RoleEnum'
          readOnly: true
        mobile_number:
          type: string
          readOnly: true
        email_verified:
          type: boolean
          readOnly: true
        platform_connected:
          type: boolean
          nullable: true
          readOnly: true
          description: 'Brands only: whether at least one platform is verified (YouTube,
            or a link an admin approved). Null for everyone else.'
        platform_status:
          type: string
          nullable: true
          readOnly: true
          description: 'Brands only: verified, pending (a link waits for an admin)
            or none. Null for everyone else.'
        avatar_url:
          type: string
          nullable: true
          readOnly: true
          description: The creator's photo or the brand's logo, if they have one.
      required:
      - avatar_url
      - email
      - email_verified
      - full_name
      - id
      - mobile_number
      - platform_connected
      - platform_status
      - role
      - username
    Withdraw:
      type: object
      properties:
        reason:
          type: string
          maxLength: 300
    YouTubeConnectionStatusEnum:
      enum:
      - connected
      - needs_reconnect
      type: string
      description: |-
        * `connected` - Connected
        * `needs_reconnect` - Needs reconnect
    YouTubeStatus:
      type: object
      properties:
        connected:
          type: boolean
        status:
          nullable: true
          oneOf:
          - $ref: '#/components/schemas/YouTubeConnectionStatusEnum'
          - $ref: '#/components/schemas/NullEnum'
        needs_reconnect:
          type: boolean
        connected_at:
          type: string
          format: date-time
          nullable: true
        last_synced_at:
          type: string
          format: date-time
          nullable: true
        is_outdated:
          type: boolean
        last_error:
          type: string
          nullable: true
        followers:
          type: integer
          nullable: true
          description: Subscribers at the last sync, if any.
        minimum_followers:
          type: integer
          description: Subscribers needed to be Verified and apply.
        below_minimum:
          type: boolean
          description: True when a channel is connected but has fewer subscribers
            than the minimum.
      required:
      - below_minimum
      - connected
      - connected_at
      - followers
      - is_outdated
      - last_error
      - last_synced_at
      - minimum_followers
      - needs_reconnect
      - status
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
tags:
- name: Health
  description: Liveness probe used by deployments.
- name: Auth
  description: Registration, login, logout and password reset.
- name: Profiles
  description: Creator and brand profiles, and the creator's portfolio.
- name: Social
  description: Platform stats, YouTube connection (OAuth) and manual stats entry.
- name: Discovery
  description: Brand-facing creator directory and creator-facing campaign directory.
- name: Campaigns
  description: 'A brand''s campaigns: create, edit, publish and close.'
- name: Proposals
  description: Applying to campaigns and managing the proposals received.
- name: Reviews
  description: Ratings and reviews of creators after completed collaborations.
- name: Notifications
  description: In-app notifications.
- name: Dashboards
  description: The creator and brand home screens.
- name: Admin
  description: 'The admin panel: user management, moderation and platform overview.'
