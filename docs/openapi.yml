openapi: 3.0.3
info:
  title: Micro-Influencers' Platform API
  version: 1.0.0
  description: |-
    REST API for the two-sided creator / brand marketplace.

    ## Authentication
    Log in with `POST /auth/login/` and send the returned token on every other request as `Authorization: Bearer <token>`. Tokens last 24 hours. Only the endpoints without a padlock in this document are public.

    ## Errors
    Every error has the same shape: `{"error": {"code": "...", "message": "...", "details": ...}}`. `code` is stable and meant for the frontend to branch on; `details` holds per-field messages for validation errors (HTTP 400) and is `null` otherwise.

    ## Pagination
    List endpoints return `count`, `next`, `previous` and `results`. Use `page` and `page_size` (default 20, maximum 50).
paths:
  /api/v1/auth/email/resend/:
    post:
