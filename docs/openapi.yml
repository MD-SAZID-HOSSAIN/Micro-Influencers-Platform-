          enum:
          - instagram
          - youtube
          - tiktok
          - facebook
          type: string
          minLength: 1
        description: |-
          * `instagram` - Instagram
          * `youtube` - YouTube
          * `tiktok` - TikTok
          * `facebook` - Facebook
      - in: query
        name: q
        schema:
          type: string
          maxLength: 100
      tags:
